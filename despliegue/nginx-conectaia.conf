# Nginx para www.conectaia.solucionesctec.com
#
# Se copia al servidor y se activa:
#
#   sudo cp despliegue/nginx-conectaia.conf /etc/nginx/sites-available/conectaia
#   sudo ln -s /etc/nginx/sites-available/conectaia /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# El certificado lo añade certbot DESPUÉS (ver DESPLIEGUE.md): reescribe este
# archivo solo, añadiendo el bloque 443 y la redirección desde el 80.

server {
    listen 80;
    listen [::]:80;

    # Las dos: quien escriba el dominio sin "www" tiene que llegar igual.
    server_name www.conectaia.solucionesctec.com conectaia.solucionesctec.com;

    # Las fotos que suben los usuarios pesan y no cambian: las sirve Nginx
    # directamente, sin despertar a Node. `alias` y no `root` porque la ruta
    # del disco no coincide con la de la URL.
    location /uploads/ {
        alias /var/www/conectaia/public/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Lo compilado por Next tampoco cambia: lleva un hash en el nombre.
    location /_next/static/ {
        alias /var/www/conectaia/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;

        # ⚠️ Estas cabeceras NO son opcionales. NextAuth va con
        # `trustHost: true`, así que reconstruye la URL de retorno a partir de
        # lo que le llegue: sin `X-Forwarded-Proto https` cree que está en
        # http, marca la cookie de sesión como insegura y el navegador la
        # rechaza. Síntoma: el login "funciona" y acto seguido estás fuera.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Para el hot-reload de Next y cualquier conexión larga.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }

    # Las fotos de las publicaciones llegan por multipart. El límite de Nginx
    # por defecto es 1 MB, y una foto de celular lo pasa de sobra: sin esto,
    # publicar con fotos falla con un 413 que la aplicación no puede explicar.
    client_max_body_size 12M;

    # Comprimir lo que se sirve desde aquí.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
